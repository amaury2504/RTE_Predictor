[project]
name = "app-electricite-ia"
version = "0.1.0"
description = "Prédiction de consommation électrique journalière avec réseau de neurones"
authors = [
    {name = "Amaury Lescure",email = "amaurylescure9@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.128.1,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "torch (>=2.10.0,<3.0.0) ; python_version == \"3.14\"",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "holidays (>=0.90,<0.91)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "bcrypt (<4.1)",
    "lightgbm (>=4.7,<5.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]