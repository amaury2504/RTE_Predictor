# RTE Predictor : API + frontend. Le HTTPS et le nom de domaine sont gérés par le reverse proxy commun du
# serveur (deploy/server/), auquel le conteneur "web" se rattache via le réseau externe "proxy".
#
# Lancer, depuis ce dossier :  docker compose up -d --build
name: rte-predictor

services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Les bases SQLite sont dans le volume : elles survivent aux redémarrages et aux mises à jour
      DATABASE_URL: sqlite:////app/data/electricity.db
      DATABASE_AUTH_URL: sqlite:////app/data/auth.db
      # Charge Timestral au démarrage, en tâche de fond : le premier visiteur n'attend pas les poids
      TIMESTRAL_PRELOAD: "true"
    volumes:
      # Contient model.pth, scaler_*.pkl, mlp_niveau.pkl, lightgbm_niveau.pkl, ridge_niveau.pkl (non versionnés), les bases SQLite et le cache des poids Timestral
      - ./data:/app/data
    mem_limit: 1g          # PyTorch consomme de la mémoire : on protège les autres projets du serveur
    networks: [default]

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    networks: [default, proxy]

networks:
  proxy:
    external: true
